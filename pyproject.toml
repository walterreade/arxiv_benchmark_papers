[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "arxiv-bench"
version = "0.2.0"
description = "All-arXiv AI benchmark corpus pipeline, Gemini Decision 1 rubric engine, and religious-bias module"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-cloud-storage>=2.18.0",
    "google-genai>=3.2.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.5",
    "tqdm>=4.66.0",
    "zstandard>=0.23.0",
]

[project.scripts]
arxiv-bench = "arxiv_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
